apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 10
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
        - name: my-app-container
          image: nginx:1.27.4-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_SETTING  # Inject ConfigMap value
              valueFrom:
                configMapKeyRef:
                  name: my-config
                  key: APP_SETTING