apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nifi-ingress
  namespace: nifi
spec:
  ingressClassName: nginx
  rules:
    - host: adminer.int.taqniat.ae
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nifi-adminer-svc
                port:
                  number: 8446